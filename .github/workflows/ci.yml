name: CI

# Packagist publishes new versions from git tags on its own; this workflow only runs the tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # readonly properties need PHP 8.1+.
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl
          coverage: none
      - name: Install dependencies
        shell: bash
        env:
          COMPOSER_DISABLE_NETWORK_TIMEOUT: 1
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "composer install attempt $attempt"
            if composer install --no-interaction --no-progress --prefer-dist; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Composer install failed, retrying in 15 seconds..."
            sleep 15
          done
      - run: vendor/bin/phpunit
