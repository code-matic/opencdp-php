name: CI

# Packagist publishes new versions from git tags on its own; this workflow only runs the tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # readonly properties need PHP 8.1+.
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
